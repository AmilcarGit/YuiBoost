name: YuiBoost CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Bash project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check required project files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "yui"
            "install.sh"
            "core/restore.sh"
            "README.md"
            "LICENSE"
            "SECURITY.md"
          )
          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi
          done
          echo "✓ Required files are present."

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(
            find . -type f \( -name "*.sh" -o -name "yui" \) -not -path "./.git/*" -print
          )
          if [[ "${#scripts[@]}" -eq 0 ]]; then
            echo "::error::No shell scripts found."
            exit 1
          fi
          for script in "${scripts[@]}"; do
            echo "Checking: $script"
            bash -n "$script"
          done
          echo "✓ Bash syntax is valid."

      - name: Run ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(
            find . -type f \( -name "*.sh" -o -name "yui" \) -not -path "./.git/*" -print
          )
          shellcheck --severity=warning "${scripts[@]}"
          echo "✓ ShellCheck passed."

      - name: Check executable entrypoints
        shell: bash
        run: |
          set -euo pipefail
          for file in yui install.sh core/restore.sh; do
            if [[ ! -x "$file" ]]; then
              chmod +x "$file"
            fi
          done
          echo "✓ Entry points are executable."

      - name: Test help command
        shell: bash
        run: |
          set -euo pipefail
          if ! ./yui --help >/tmp/yui-help.txt 2>&1; then
            echo "::error::yui --help failed."
            cat /tmp/yui-help.txt
            exit 1
          fi
          test -s /tmp/yui-help.txt
          cat /tmp/yui-help.txt
          echo "✓ Help command passed."

      - name: Check dangerous command patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE \
            --exclude-dir=.git \
            --exclude='*.md' \
            --exclude='*.txt' \
            --exclude='*.yml' \
            --exclude='*.yaml' \
            'rm[[:space:]]+-rf[[:space:]]+(/|/\*|\\\$HOME|\\\$PREFIX)' \
            .; then
            echo "::error::Potentially destructive rm -rf pattern detected."
            exit 1
          fi
          echo "✓ No blocked destructive command pattern detected."

      - name: Check for accidental secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE \
            --exclude-dir=.git \
            --exclude='*.md' \
            --exclude='*.txt' \
            --exclude='*.yml' \
            --exclude='*.yaml' \
            '(sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,})' \
            .; then
            echo "::error::Possible hard-coded API token detected."
            exit 1
          fi
          echo "✓ No common hard-coded token pattern detected."

  markdown:
    name: Validate documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check README
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          grep -q "YuiBoost" README.md
          grep -q "Termux" README.md
          grep -q "Limitaciones" README.md
          echo "✓ README validation passed."

  security:
    name: Security baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify security documentation
        shell: bash
        run: |
          set -euo pipefail
          test -s SECURITY.md
          grep -Eqi "security|seguridad" SECURITY.md
          echo "✓ SECURITY.md validation passed."
